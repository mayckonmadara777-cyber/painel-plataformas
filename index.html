<!doctype html>
<html lang="pt-BR">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Painel do ADM Way</title>

<style>

:root{
  --bg:#07050b;
  --card:#110c18;
  --card2:#170f20;
  --p:#9b4dff;
  --p2:#c66bff;
  --txt:#f7f2ff;
  --muted:#a99bb5;
  --border:rgba(155,77,255,.25);
  --danger:#ff416c;
  --shadow:0 0 30px rgba(155,77,255,.12);
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
  width:100%;
  max-width:100%;
  overflow-x:hidden;
}

body{
  background:
    radial-gradient(
      circle at top,
      #1b0d2b 0,
      #07050b 42%,
      #050409 100%
    );
  color:var(--txt);
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}

button,
input,
textarea{
  font:inherit;
  max-width:100%;
}

button{
  cursor:pointer;
}

img,
a{
  max-width:100%;
}

.hidden{
  display:none!important;
}


/* LOGIN */

#login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.loginBox{
  width:100%;
  max-width:420px;
  background:rgba(17,12,24,.96);
  border:1px solid var(--border);
  border-radius:22px;
  padding:28px;
  box-shadow:var(--shadow);
}

.logoLogin{
  text-align:center;
  font-size:26px;
  font-weight:900;
  margin-bottom:8px;
}

.logoLogin span{
  color:var(--p2);
}

.loginSub{
  text-align:center;
  color:var(--muted);
  margin-bottom:25px;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  margin-bottom:7px;
  color:#ddd1e8;
  font-size:14px;
}

.field input,
.field textarea{
  width:100%;
  background:#0b0810;
  color:var(--txt);
  border:1px solid var(--border);
  border-radius:12px;
  padding:13px;
  outline:none;
}

.field textarea{
  min-height:110px;
  resize:vertical;
}

.field input:focus,
.field textarea:focus{
  border-color:var(--p);
  box-shadow:0 0 0 3px rgba(155,77,255,.08);
}

.primary{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  background:linear-gradient(
    135deg,
    var(--p),
    var(--p2)
  );
  color:white;
  font-weight:900;
}

.secondary{
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 14px;
  background:#120d19;
  color:var(--txt);
}

.error{
  color:#ff718e;
  margin-top:12px;
  text-align:center;
  font-size:14px;
}


/* APP */

#app{
  min-height:100vh;
  width:100%;
  max-width:100%;
  overflow-x:hidden;
}

.top{
  position:sticky;
  top:0;
  z-index:20;
  backdrop-filter:blur(15px);
  background:rgba(7,5,11,.86);
  border-bottom:1px solid rgba(155,77,255,.14);
}

.topIn{
  width:100%;
  max-width:1200px;
  margin:auto;
  padding:15px 18px;
  display:flex;
  align-items:center;
  gap:14px;
  min-width:0;
}

.brand{
  font-size:21px;
  font-weight:900;
  flex:1;
  min-width:0;
}

.brand span{
  color:var(--p2);
}

.role{
  color:var(--muted);
  font-size:12px;
  font-weight:bold;
  white-space:nowrap;
}

.topBtn{
  border:1px solid var(--border);
  border-radius:10px;
  padding:9px 12px;
  background:#120d19;
  color:var(--txt);
  font-weight:bold;
  max-width:100%;
}

.container{
  width:100%;
  max-width:1200px;
  margin:auto;
  padding:25px 18px 50px;
  min-width:0;
}

.hero{
  padding:20px 0 25px;
}

.hero h1{
  margin:0 0 8px;
  font-size:30px;
}

.hero p{
  margin:0;
  color:var(--muted);
}

.sectionTitle{
  margin:30px 0 15px;
  font-size:20px;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(250px,1fr));
  gap:16px;
  width:100%;
  min-width:0;
}


/* CARDS */

.card{
  background:
    linear-gradient(
      145deg,
      rgba(23,15,32,.98),
      rgba(13,9,18,.98)
    );
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  box-shadow:var(--shadow);
  transition:.2s;
  min-width:0;
  max-width:100%;
}

.card:hover{
  transform:translateY(-2px);
  border-color:rgba(198,107,255,.5);
}

.thumb{
  height:165px;
  background:#0b0810;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  width:100%;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.thumbFallback{
  font-size:55px;
  opacity:.55;
}

.body{
  padding:17px;
  min-width:0;
  overflow:hidden;
}

.body h3{
  margin:0 0 10px;
  font-size:19px;
  overflow-wrap:anywhere;
}

.desc{
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
  min-height:42px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:15px;
  flex-wrap:wrap;
  width:100%;
}

.actions a,
.actions button{
  flex:1 1 100px;
  min-width:0;
  text-align:center;
  text-decoration:none;
  border:0;
  border-radius:10px;
  padding:11px;
  font-weight:900;
}

.actions a{
  background:linear-gradient(
    135deg,
    var(--p),
    var(--p2)
  );
  color:white;
}

.actions button{
  background:#24132e;
  color:white;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  color:var(--muted);
  padding:35px 15px;
  border:1px dashed var(--border);
  border-radius:16px;
  overflow-wrap:anywhere;
}


/* ADMIN */

.adminBox{
  margin-top:20px;
  background:rgba(17,12,24,.72);
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
  min-width:0;
  max-width:100%;
  overflow:hidden;
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:20px;
}

.tabBtn{
  border:1px solid var(--border);
  background:#100b16;
  color:var(--muted);
  padding:11px 15px;
  border-radius:10px;
  font-weight:bold;
}

.tabBtn.active{
  background:linear-gradient(
    135deg,
    var(--p),
    var(--p2)
  );
  color:white;
}

.adminHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
  min-width:0;
}

.adminHead h2{
  margin:0;
  font-size:19px;
}

.addBtn{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  background:linear-gradient(
    135deg,
    var(--p),
    var(--p2)
  );
  color:white;
  font-weight:900;
}

    
/* MODAL */

#modal{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.72);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  overflow:auto;
}

.modalBox{
  width:100%;
  max-width:500px;
  max-height:90vh;
  overflow:auto;
  background:#110c18;
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px;
  min-width:0;
}

.modalTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}

.modalTop h2{
  margin:0;
  font-size:20px;
  overflow-wrap:anywhere;
}

.closeBtn{
  width:36px;
  height:36px;
  min-width:36px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#170f20;
  color:white;
  font-size:20px;
}

.modalActions{
  display:flex;
  gap:8px;
  margin-top:15px;
  flex-wrap:wrap;
}

.modalActions button{
  flex:1 1 120px;
  min-width:0;
}


/* RESPONSIVO */

@media(max-width:650px){

  .topIn{
    flex-wrap:wrap;
    padding:12px 14px;
  }

  .brand{
    min-width:100%;
    font-size:19px;
  }

  .role{
    flex:1;
    min-width:0;
  }

  .topBtn{
    white-space:nowrap;
  }

  .container{
    padding:20px 14px 40px;
  }

  .hero h1{
    font-size:25px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .adminHead{
    align-items:stretch;
    flex-direction:column;
  }

  .addBtn{
    width:100%;
  }

  .tabs{
    width:100%;
  }

  .tabBtn{
    width:100%;
  }

  .actions{
    flex-direction:column;
  }

  .actions a,
  .actions button{
    width:100%;
    flex:1 1 auto;
  }

}

</style>

</head>

<body>


<section id="login" class="hidden">

  <div class="loginBox">

    <div class="logoLogin">
      Painel do <span>ADM Way</span>
    </div>

    <div class="loginSub">
      Acesso administrativo
    </div>

    <form id="loginForm">

      <div class="field">

        <label for="phone">
          Telefone
        </label>

        <input
          id="phone"
          type="tel"
          autocomplete="username"
          placeholder="Digite o telefone"
          required
        >

      </div>


      <div class="field">

        <label for="pass">
          Senha
        </label>

        <input
          id="pass"
          type="password"
          autocomplete="current-password"
          placeholder="Digite a senha"
          required
        >

      </div>


      <button
        class="primary"
        type="submit"
      >
        ENTRAR
      </button>

      <div
        id="err"
        class="error"
      ></div>

      <button
        type="button"
        class="secondary"
        style="width:100%;margin-top:10px"
        onclick="closeAdminLogin()"
      >
        VOLTAR
      </button>

    </form>

  </div>

</section>


<section id="app" class="hidden">

  <header class="top">

    <div class="topIn">

      <div class="brand">
        Painel do <span>ADM Way</span>
      </div>

      <div
        id="role"
        class="role"
      >
        VISITANTE
      </div>

      <button
        id="adminAccess"
        class="topBtn"
        onclick="openAdminLogin()"
      >
        ⚙️ ÁREA ADM
      </button>

      <button
        id="logoutBtn"
        class="topBtn hidden"
        onclick="logout()"
      >
        SAIR
      </button>

    </div>

  </header>


  <main class="container">

    <div class="hero">

      <h1>
        Plataformas disponíveis
      </h1>

      <p>
        Acesse rapidamente as plataformas disponíveis.
      </p>

    </div>


    <section
      id="admin"
      class="adminBox hidden"
    >

      <div class="tabs">

        <button
          class="tabBtn active"
          type="button"
        >
          Plataformas
        </button>

      </div>


      <div id="plats">

        <div class="adminHead">

          <h2>
            Gerenciar plataformas
          </h2>

          <button
            class="addBtn"
            onclick="platformModal()"
          >
            + ADICIONAR
          </button>

        </div>

        <div
          id="adminGrid"
          class="grid"
        ></div>

      </div>

    </section>


    <section id="client">

      <h2 class="sectionTitle">
        Plataformas adicionadas recentemente
      </h2>

      <div
        id="recent"
        class="grid"
      ></div>


      <h2 class="sectionTitle">
        Todas as plataformas
      </h2>

      <div
        id="all"
        class="grid"
      ></div>

    </section>

  </main>

</section>


<div
  id="modal"
  class="hidden"
>

  <div class="modalBox">

    <div class="modalTop">

      <h2 id="mt">
        Modal
      </h2>

      <button
        class="closeBtn"
        onclick="closeM()"
      >
        ×
      </button>

    </div>

    <div id="mb"></div>

  </div>

</div>


<script>

let me = null;

let data = [];

let editingPlatformId = null;


const $ = x =>
  document.getElementById(x);


const esc = s =>
  String(s ?? "")
    .replace(
      /[&<>"']/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[c])
    );


async function api(
  url,
  options = {}
){

  const response =
    await fetch(
      url,
      {
        credentials:"same-origin",
        ...options,
        headers:{
          "Content-Type":
            "application/json",
          ...(options.headers || {})
        }
      }
    );


  let result = {};

  try{

    result =
      await response.json();

  }catch{

    result = {};

  }


  if(!response.ok){

    throw new Error(
      result.error ||
      result.message ||
      "Erro na comunicação com o servidor."
    );

  }


  return result;

}


function showPublic(){

  $("login")
    .classList
    .add("hidden");

  $("app")
    .classList
    .remove("hidden");

  $("admin")
    .classList
    .add("hidden");

  $("client")
    .classList
    .remove("hidden");

  $("adminAccess")
    .classList
    .remove("hidden");

  $("logoutBtn")
    .classList
    .add("hidden");

  $("role").textContent =
    "VISITANTE";

  load();

}


function show(){

  $("login")
    .classList
    .add("hidden");

  $("app")
    .classList
    .remove("hidden");


  if(me && me.role === "admin"){

    $("adminAccess")
      .classList
      .add("hidden");

    $("logoutBtn")
      .classList
      .remove("hidden");

    $("role").textContent =
      "ADMINISTRADOR";


    $("admin")
      .classList
      .remove("hidden");

    $("client")
      .classList
      .remove("hidden");

    load();

    return;

  }


  showPublic();

}


function openAdminLogin(){

  $("login")
    .classList
    .remove("hidden");

  $("app")
    .classList
    .add("hidden");

  $("err").textContent = "";

  $("phone").value = "";

  $("pass").value = "";

  setTimeout(
    () => $("phone").focus(),
    50
  );

}


function closeAdminLogin(){

  $("login")
    .classList
    .add("hidden");

  $("app")
    .classList
    .remove("hidden");


  if(!me){

    showPublic();

  }

}


$("loginForm").onsubmit =
async e => {

  e.preventDefault();

  $("err").textContent =
    "Entrando...";


  try{

    const result =
      await api(
        "/api/auth/login",
        {
          method:"POST",
          body:JSON.stringify({
            phone:$("phone").value.trim(),
            password:$("pass").value
          })
        }
      );


    me = result.user;


    if(
      !me ||
      me.role !== "admin"
    ){

      throw new Error(
        "Acesso permitido somente ao administrador."
      );

    }


    show();


  }catch(error){

    $("err").textContent =
      error.message;

  }

};


async function logout(){

  try{

    await api(
      "/api/auth/logout",
      {
        method:"POST"
      }
    );

  }catch{}

  me = null;

  location.reload();

  }

     
async function load(){

  try{

    const result =
      await api(
        "/api/platforms"
      );

    data =
      result.platforms ||
      result ||
      [];

    if(!Array.isArray(data)){

      data = [];

    }

    render();

  }catch(error){

    $("recent").innerHTML =
      `
        <div class="empty">
          Não foi possível carregar as plataformas.
          <br><br>
          ${esc(error.message)}
        </div>
      `;

    $("all").innerHTML = "";

    if($("adminGrid")){

      $("adminGrid").innerHTML =
        `
          <div class="empty">
            ${esc(error.message)}
          </div>
        `;

    }

  }

}


/* =========================
   CARD DA PLATAFORMA
========================= */

function card(
  platform,
  admin = false
){

  const image =
    platform.image_url ||
    "";

  const description =
    platform.description ||
    "Acesse esta plataforma.";

  const safeUrl =
    esc(platform.url);


  const imageHtml =
    image
      ?

        `
          <img
            src="${esc(image)}"
            alt="${esc(
              platform.name
            )}"
            loading="lazy"
            onerror="
              this.style.display='none';
              this.parentElement
                .querySelector('.thumbFallback')
                .style.display='block';
            "
          >

          <div
            class="thumbFallback"
            style="display:none"
          >
            🌐
          </div>
        `

      :

        `
          <div class="thumbFallback">
            🌐
          </div>
        `;


  if(admin){

    return `

      <div class="card">

        <div class="thumb">

          ${imageHtml}

        </div>


        <div class="body">

          <h3>
            ${esc(platform.name)}
          </h3>


          <div class="desc">
            ${esc(description)}
          </div>


          <div class="actions">

            <a
              href="${safeUrl}"
              target="_blank"
              rel="noopener noreferrer"
            >
              ACESSAR
            </a>


            <button
              type="button"
              onclick="platformModal(${Number(platform.id)})"
            >
              EDITAR
            </button>


            <button
              type="button"
              onclick="delP(${Number(platform.id)})"
            >
              EXCLUIR
            </button>

          </div>

        </div>

      </div>

    `;

  }


  return `

    <div class="card">

      <div class="thumb">

        ${imageHtml}

      </div>


      <div class="body">

        <h3>
          ${esc(platform.name)}
        </h3>


        <div class="desc">
          ${esc(description)}
        </div>


        <div class="actions">

          <a
            href="${safeUrl}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ACESSAR
          </a>

        </div>

      </div>

    </div>

  `;

}


/* =========================
   RENDERIZAÇÃO
========================= */

function render(){

  const now =
    Date.now();


  const SEVEN_DAYS =
    7 *
    24 *
    60 *
    60 *
    1000;


  const recentData =
    data.filter(
      platform => {

        const created =
          platform.created_at ||
          platform.createdAt;

        if(!created){

          return false;

        }


        const date =
          new Date(created)
            .getTime();


        if(Number.isNaN(date)){

          return false;

        }


        const age =
          now - date;


        return (
          age >= 0 &&
          age <= SEVEN_DAYS
        );

      }
    );


  if(recentData.length){

    $("recent").innerHTML =
      recentData
        .map(
          platform =>
            card(platform)
        )
        .join("");

  }else{

    $("recent").innerHTML =
      `
        <div class="empty">
          Nenhuma plataforma adicionada
          recentemente.
        </div>
      `;

  }


  if(data.length){

    $("all").innerHTML =
      data
        .map(
          platform =>
            card(platform)
        )
        .join("");

  }else{

    $("all").innerHTML =
      `
        <div class="empty">
          Nenhuma plataforma cadastrada.
        </div>
      `;

  }


  if(
    me &&
    me.role === "admin"
  ){

    if(data.length){

      $("adminGrid").innerHTML =
        data
          .map(
            platform =>
              card(
                platform,
                true
              )
          )
          .join("");

    }else{

      $("adminGrid").innerHTML =
        `
          <div class="empty">
            Nenhuma plataforma cadastrada.
          </div>
        `;

    }

  }

}


/* =========================
   FECHAR MODAL
========================= */

function closeM(){

  $("modal")
    .classList
    .add("hidden");

  editingPlatformId =
    null;

}


/* =========================
   MODAL PLATAFORMA
========================= */

async function platformModal(
  id = null
){

  editingPlatformId =
    id;

  let platform = null;


  if(id){

    platform =
      data.find(
        item =>
          Number(item.id) ===
          Number(id)
      );


    if(!platform){

      try{

        const result =
          await api(
            `/api/platforms/${id}`
          );

        platform =
          result.platform;

      }catch{}

    }

  }


  $("mt").textContent =
    platform
      ? "Editar plataforma"
      : "Adicionar plataforma";


  $("mb").innerHTML =
    `

      <form
        onsubmit="savePlatform(event)"
      >

        <div class="field">

          <label>
            Nome
          </label>

          <input
            id="pName"
            value="${esc(
              platform?.name ||
              ""
            )}"
            placeholder="Nome da plataforma"
            required
          >

        </div>


        <div class="field">

          <label>
            Link da plataforma
          </label>

          <input
            id="pUrl"
            type="url"
            value="${esc(
              platform?.url ||
              ""
            )}"
            placeholder="https://exemplo.com"
            required
          >

        </div>


        <div class="field">

          <label>
            Descrição
          </label>

          <textarea
            id="pDesc"
            placeholder="Descrição da plataforma"
          >${esc(
            platform?.description ||
            ""
          )}</textarea>

        </div>


        <div class="modalActions">

          <button
            type="submit"
            class="primary"
          >
            SALVAR
          </button>

          <button
            type="button"
            class="secondary"
            onclick="closeM()"
          >
            CANCELAR
          </button>

        </div>

      </form>

    `;


  $("modal")
    .classList
    .remove("hidden");


  setTimeout(
    () => $("pName").focus(),
    50
  );

}

    
async function savePlatform(e){

  e.preventDefault();


  const name =
    $("pName")
      .value
      .trim();


  const url =
    $("pUrl")
      .value
      .trim();


  const description =
    $("pDesc")
      .value
      .trim();


  if(!name){

    alert(
      "Digite o nome da plataforma."
    );

    return;

  }


  if(!url){

    alert(
      "Digite o link da plataforma."
    );

    return;

  }


  try{

    const payload = {
      name,
      url,
      description
    };


    if(editingPlatformId){

      await api(
        `/api/platforms/${editingPlatformId}`,
        {
          method:"PUT",
          body:JSON.stringify(
            payload
          )
        }
      );

    }else{

      await api(
        "/api/platforms",
        {
          method:"POST",
          body:JSON.stringify(
            payload
          )
        }
      );

    }


    closeM();

    await load();


  }catch(error){

    alert(
      error.message
    );

  }

}


/* =========================
   EXCLUIR PLATAFORMA
========================= */

async function delP(id){

  const platform =
    data.find(
      item =>
        Number(item.id) ===
        Number(id)
    );


  const name =
    platform?.name ||
    "esta plataforma";


  const confirmed =
    confirm(
      `Tem certeza que deseja excluir "${name}"?`
    );


  if(!confirmed){

    return;

  }


  try{

    await api(
      `/api/platforms/${id}`,
      {
        method:"DELETE"
      }
    );


    await load();


  }catch(error){

    alert(
      error.message
    );

  }

}


/* =========================
   FECHAR MODAL AO CLICAR FORA
========================= */

$("modal").addEventListener(
  "click",
  event => {

    if(
      event.target ===
      $("modal")
    ){

      closeM();

    }

  }
);


/* =========================
   INICIALIZAÇÃO
========================= */

async function boot(){

  try{

    const result =
      await api(
        "/api/auth/me"
      );


    me =
      result.user ||
      null;


    if(
      me &&
      me.role === "admin"
    ){

      show();

      return;

    }


    me = null;

    showPublic();


  }catch{

    me = null;

    showPublic();

  }

}


boot();

</script>
