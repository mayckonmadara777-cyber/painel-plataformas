<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel do ADM Way</title>

<style>

:root{
  --bg:#07050b;
  --card:#110c18;
  --p:#9b4dff;
  --p2:#c66bff;
  --txt:#f7f2ff;
  --muted:#a99bb8;
  --line:#2b193d;
  --danger:#ff5275;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(
      circle at top,
      #1c0b2b,
      #07050b 48%
    );
  color:var(--txt);
  font-family:system-ui,Arial,sans-serif;
}

.hidden{
  display:none!important;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:16px;
}

.login{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:18px;
}

.box{
  width:min(430px,100%);
  background:#110c18ef;
  border:1px solid var(--line);
  border-radius:24px;
  padding:28px;
  box-shadow:0 0 45px #9b4dff25;
}

.logo{
  font-size:26px;
  font-weight:900;
}

.logo b{
  color:var(--p2);
}

.muted{
  color:var(--muted);
}

.field{
  margin:12px 0;
}

.field label{
  display:block;
  font-size:13px;
  margin-bottom:6px;
  color:#d4c8dd;
}

input,
textarea{
  width:100%;
  padding:13px;
  border-radius:12px;
  border:1px solid #382248;
  background:#0a0710;
  color:white;
  outline:0;
}

textarea{
  min-height:90px;
}

input:focus,
textarea:focus{
  border-color:var(--p);
}

button,
.btn{
  border:0;
  border-radius:12px;
  padding:11px 14px;
  font-weight:800;
  color:white;
  background:
    linear-gradient(
      135deg,
      #7e31e8,
      #b85cff
    );
  cursor:pointer;
  text-decoration:none;
  display:inline-block;
}

button:disabled{
  opacity:.6;
  cursor:wait;
}

.secondary{
  background:#21152c;
}

.danger{
  background:#42101e;
  color:#ff9aae;
}

.small{
  font-size:13px;
  padding:9px 11px;
}

.top,
.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.top{
  padding:8px 0 20px;
}

.hero{
  background:#9b4dff18;
  border:1px solid var(--line);
  border-radius:20px;
  padding:20px;
  margin-bottom:18px;
}

.hero h1{
  margin:0 0 5px;
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:18px;
}

.tab{
  background:#0e0913;
  border:1px solid var(--line);
}

.tab.active{
  background:#2a173b;
  border-color:#783db0;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(
      auto-fill,
      minmax(220px,1fr)
    );
  gap:14px;
}

.card{
  background:#110c18;
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
}

.thumb{
  height:125px;
  background:#0b0810;
  display:grid;
  place-items:center;
  overflow:hidden;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.ph{
  font-size:36px;
  color:var(--p2);
}

.body{
  padding:14px;
}

.body h3{
  margin:0 0 6px;
}

.desc{
  color:var(--muted);
  font-size:13px;
  min-height:36px;
}

.actions{
  display:flex;
  gap:7px;
  margin-top:12px;
}

.actions>*{
  flex:1;
  text-align:center;
}

.panel{
  background:#110c18;
  border:1px solid var(--line);
  border-radius:18px;
  padding:17px;
  margin-bottom:18px;
}

.formgrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.full{
  grid-column:1/-1;
}

.list{
  display:grid;
  gap:9px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:12px;
  background:#0d0912;
  border:1px solid #261635;
  border-radius:13px;
}

.ra{
  display:flex;
  gap:7px;
}

.empty{
  border:1px dashed #39234a;
  border-radius:16px;
  padding:24px;
  text-align:center;
  color:var(--muted);
  grid-column:1/-1;
}

.modal{
  position:fixed;
  inset:0;
  background:#000b;
  display:grid;
  place-items:center;
  padding:16px;
  z-index:5;
}

.modalbox{
  width:min(560px,100%);
  max-height:90vh;
  overflow:auto;
  background:#100b16;
  border:1px solid var(--line);
  border-radius:20px;
  padding:20px;
}

.modalhead{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.close{
  background:none;
  font-size:26px;
  padding:0;
}

.auto-image-info{
  background:#160d20;
  border:1px solid #39204e;
  color:#cdb7df;
  border-radius:12px;
  padding:11px;
  font-size:12px;
  line-height:1.5;
  margin-top:8px;
}

@media(max-width:650px){

  .formgrid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .grid{
    grid-template-columns:1fr 1fr;
  }

  .row{
    flex-direction:column;
    align-items:flex-start;
  }

  .ra{
    width:100%;
  }

  .ra>*{
    flex:1;
  }

  .top{
    align-items:flex-start;
  }

}

</style>
</head>

<body>

<!-- LOGIN -->

<div id="login" class="login">

  <div class="box">

    <div class="logo">
      PAINEL <b>DO ADM WAY</b>
    </div>

    <p class="muted">
      Entre para acessar o painel.
    </p>

    <form id="loginForm">

      <div class="field">

        <label>
          Telefone
        </label>

        <input
          id="phone"
          inputmode="tel"
          required
        >

      </div>

      <div class="field">

        <label>
          Senha
        </label>

        <input
          id="pass"
          type="password"
          required
        >

      </div>

      <button
        type="submit"
        style="width:100%"
      >
        ENTRAR
      </button>

      <p
        id="err"
        class="muted"
      ></p>

    </form>

  </div>

</div>

<!-- PAINEL -->

<div id="app" class="hidden">

  <div class="wrap">

    <header class="top">

      <div class="logo">
        PAINEL <b>DO ADM WAY</b>
      </div>

      <div>

        <span
          id="role"
          class="muted"
        ></span>

        <button
          class="secondary small"
          onclick="logout()"
        >
          Sair
        </button>

      </div>

    </header>


    <div class="hero">

      <h1 id="title">
        Painel do ADM Way
      </h1>

      <div class="muted">
        Suas plataformas organizadas em um só lugar.
      </div>

    </div>


    <!-- ADMIN -->

    <div id="admin" class="hidden">

      <div class="tabs">

        <button
          class="tab active"
          onclick="tab('plats',this)"
        >
          Plataformas
        </button>

        <button
          class="tab"
          onclick="tab('clients',this)"
        >
          Clientes
        </button>

      </div>


      <section id="plats">

        <div class="section-title">

          <h2>
            Plataformas
          </h2>

          <button
            onclick="platformModal()"
          >
            + Adicionar
          </button>

        </div>

        <div
          id="adminGrid"
          class="grid"
        ></div>

      </section>


      <section
        id="clients"
        class="hidden"
      >

        <div class="section-title">

          <h2>
            Clientes
          </h2>

          <button
            onclick="clientModal()"
          >
            + Adicionar
          </button>

        </div>

        <div
          id="clientList"
          class="list"
        ></div>

      </section>

    </div>


    <!-- CLIENTE -->

    <div id="client" class="hidden">

      <div class="section-title">

        <h2>
          Plataformas adicionadas recentemente
        </h2>

      </div>

      <div
        id="recent"
        class="grid"
      ></div>


      <div class="section-title">

        <h2>
          Todas as plataformas
        </h2>

      </div>

      <div
        id="all"
        class="grid"
      ></div>

    </div>

  </div>

</div>


<!-- MODAL -->

<div
  id="modal"
  class="modal hidden"
>

  <div class="modalbox">

    <div class="modalhead">

      <h2 id="mt"></h2>

      <button
        class="close"
        onclick="closeM()"
      >
        ×
      </button>

    </div>

    <div id="mb"></div>

  </div>

</div>


<script>

let me = null;
let data = [];

const $ = x =>
  document.getElementById(x);


const esc = s =>
  String(s ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );


async function api(url, options = {}) {

  const response = await fetch(
    url,
    {
      credentials:"same-origin",

      headers:{
        "Content-Type":"application/json"
      },

      ...options
    }
  );

  let result = {};

  try {
    result = await response.json();
  } catch {}

  if (!response.ok) {

    throw Error(
      result.error || "Erro"
    );

  }

  return result;
}


/* =========================
   INICIALIZAÇÃO
========================= */

async function boot(){

  try{

    me =
      (await api(
        "/api/auth/me"
      )).user;

    show();

  }catch{

  }

}


/* =========================
   MOSTRAR PAINEL
========================= */

function show(){

  $("login")
    .classList
    .add("hidden");

  $("app")
    .classList
    .remove("hidden");


  $("role").textContent =
    me.role === "admin"
      ? "ADMIN"
      : "CLIENTE";


  $("title").textContent =
    "Painel do ADM Way";


  if(me.role === "admin"){

    $("admin")
      .classList
      .remove("hidden");

    load();

  }else{

    $("client")
      .classList
      .remove("hidden");

    load();

  }

}


/* =========================
   LOGIN
========================= */

$("loginForm").onsubmit =
async e => {

  e.preventDefault();

  $("err").textContent = "";

  try{

    me =
      (
        await api(
          "/api/auth/login",
          {
            method:"POST",

            body:JSON.stringify({

              phone:
                $("phone").value,

              password:
                $("pass").value

            })
          }
        )
      ).user;

    show();

  }catch(error){

    $("err").textContent =
      error.message;

  }

};


/* =========================
   LOGOUT
========================= */

async function logout(){

  await api(
    "/api/auth/logout",
    {
      method:"POST"
    }
  );

  location.reload();

}


/* =========================
   ABAS ADMIN
========================= */

function tab(id, button){

  document
    .querySelectorAll(
      "#admin>section"
    )
    .forEach(section =>
      section.classList
        .add("hidden")
    );


  $(id)
    .classList
    .remove("hidden");


  document
    .querySelectorAll(".tab")
    .forEach(tab =>
      tab.classList
        .remove("active")
    );


  button.classList
    .add("active");

}

/* =========================
   CARREGAR DADOS
========================= */

async function load(){

  data =
    (
      await api(
        "/api/platforms"
      )
    ).platforms;


  render();


  if(me.role === "admin"){
    clients();
  }

}


/* =========================
   CARD PLATAFORMA
========================= */

function card(
  platform,
  admin = false
){

  const image =
    platform.image_url

      ? `
        <img
          src="${esc(
            platform.image_url
          )}"
          alt="${esc(
            platform.name
          )}"
          onerror="
            this.style.display='none';
            this.parentElement.innerHTML=
            '<div class=&quot;ph&quot;>✦</div>'
          "
        >
      `

      : `
        <div class="ph">
          ✦
        </div>
      `;


  const actions = admin

    ? `
      <button
        onclick='platformModal(
          ${JSON.stringify(platform)
            .replace(/'/g,"&#39;")}
        )'
      >
        Editar
      </button>

      <button
        class="danger"
        onclick="delP(${platform.id})"
      >
        Excluir
      </button>
    `

    : `
      <a
        class="btn"
        href="${esc(platform.url)}"
        target="_blank"
        rel="noopener noreferrer"
      >
        ACESSAR
      </a>
    `;


  return `
    <div class="card">

      <div class="thumb">
        ${image}
      </div>

      <div class="body">

        <h3>
          ${esc(platform.name)}
        </h3>

        <div class="desc">
          ${esc(
            platform.description ||
            "Sem descrição"
          )}
        </div>

        <div class="actions">
          ${actions}
        </div>

      </div>

    </div>
  `;

}


/* =========================
   RENDER
========================= */

function render(){

  if(me.role === "admin"){

    $("adminGrid").innerHTML =
      data.length

        ? data
            .map(platform =>
              card(
                platform,
                true
              )
            )
            .join("")

        : `
          <div class="empty">
            Nenhuma plataforma cadastrada.
          </div>
        `;

    return;

  }


  /*
    PLATAFORMAS RECENTES:
    SOMENTE OS ÚLTIMOS 7 DIAS
  */

  const SEVEN_DAYS =
    7 * 24 * 60 * 60 * 1000;


  const recent =
    data.filter(platform => {

      const created =
        new Date(
          platform.created_at
        ).getTime();

      return (
        Date.now() - created
        < SEVEN_DAYS
      );

    });


  $("recent").innerHTML =
    recent.length

      ? recent
          .map(platform =>
            card(platform)
          )
          .join("")

      : `
        <div class="empty">
          Nenhuma plataforma nos
          últimos 7 dias.
        </div>
      `;


  $("all").innerHTML =
    data.length

      ? data
          .map(platform =>
            card(platform)
          )
          .join("")

      : `
        <div class="empty">
          Nenhuma plataforma cadastrada.
        </div>
      `;

}


/* =========================
   MODAL
========================= */

function openM(
  title,
  body
){

  $("mt").textContent =
    title;

  $("mb").innerHTML =
    body;

  $("modal")
    .classList
    .remove("hidden");

}


function closeM(){

  $("modal")
    .classList
    .add("hidden");

}


/* =========================
   MODAL PLATAFORMA
========================= */

function platformModal(
  platform = null
){

  openM(

    platform
      ? "Editar plataforma"
      : "Adicionar plataforma",

    `
      <form id="pf">

        <div class="formgrid">


          <div class="field">

            <label>
              Nome
            </label>

            <input
              id="pn"
              required
              value="${esc(
                platform?.name || ""
              )}"
            >

          </div>


          <div class="field">

            <label>
              URL da plataforma
            </label>

            <input
              id="pu"
              type="url"
              required
              placeholder="https://exemplo.com"
              value="${esc(
                platform?.url || ""
              )}"
            >

          </div>


          <div class="field full">

            <label>
              Descrição
            </label>

            <textarea
              id="pd"
            >${esc(
              platform?.description || ""
            )}</textarea>

          </div>


          <div class="field full">

            <div class="auto-image-info">

              🖼️ <b>Imagem automática</b><br>

              Você não precisa colocar
              nenhuma imagem.

              O sistema vai tentar encontrar
              automaticamente a imagem ou logo
              da própria plataforma através
              do link informado.

            </div>

          </div>


          <div class="full">

            <button
              id="savePlatform"
              type="submit"
              style="width:100%"
            >
              ${
                platform
                  ? "SALVAR"
                  : "ADICIONAR PLATAFORMA"
              }
            </button>

          </div>


        </div>

      </form>
    `
  );


  $("pf").onsubmit =
  async e => {

    e.preventDefault();


    const button =
      $("savePlatform");


    button.disabled =
      true;


    button.textContent =
      platform
        ? "SALVANDO..."
        : "BUSCANDO IMAGEM...";


    try{

      await api(

        platform
          ? "/api/platforms/" +
            platform.id
          : "/api/platforms",

        {

          method:
            platform
              ? "PUT"
              : "POST",

          body:
            JSON.stringify({

              name:
                $("pn").value,

              url:
                $("pu").value,

              description:
                $("pd").value

            })

        }

      );


      closeM();

      await load();


    }catch(error){

      button.disabled =
        false;


      button.textContent =
        platform
          ? "SALVAR"
          : "ADICIONAR PLATAFORMA";


      alert(
        error.message
      );

    }

  };

}


/* =========================
   EXCLUIR PLATAFORMA
========================= */

async function delP(id){

  if(
    !confirm(
      "Excluir plataforma?"
    )
  ){
    return;
  }


  try{

    await api(

      "/api/platforms/" +
      id,

      {
        method:"DELETE"
      }

    );


    await load();


  }catch(error){

    alert(
      error.message
    );

  }

}


/* =========================
   CLIENTES
========================= */

async function clients(){

  try{

    const clients =
      (
        await api(
          "/api/clients"
        )
      ).clients;


    $("clientList").innerHTML =

      clients.length

        ? clients
            .map(client => `

              <div class="row">

                <div>

                  <b>
                    ${esc(
                      client.phone
                    )}
                  </b>

                  <br>

                  <small
                    class="muted"
                  >
                    ${new Date(
                      client.created_at
                    ).toLocaleDateString(
                      "pt-BR"
                    )}
                  </small>

                </div>


                <div class="ra">

                  <button
                    class="secondary"
                    onclick='clientModal(
                      ${JSON.stringify(client)
                        .replace(
                          /'/g,
                          "&#39;"
                        )}
                    )'
                  >
                    Editar
                  </button>


                  <button
                    class="danger"
                    onclick="delC(
                      ${client.id}
                    )"
                  >
                    Excluir
                  </button>

                </div>

              </div>

            `)
            .join("")

        : `
          <div class="empty">
            Nenhum cliente.
          </div>
        `;


  }catch(error){

    $("clientList").innerHTML = `

      <div class="empty">

        ${esc(
          error.message
        )}

      </div>

    `;

  }

                }

  /* =========================
   MODAL CLIENTE
========================= */

function clientModal(
  client = null
){

  openM(

    client
      ? "Editar cliente"
      : "Adicionar cliente",

    `
      <form id="cf">

        <div class="field">

          <label>
            Telefone
          </label>

          <input
            id="cp"
            required
            value="${esc(
              client?.phone || ""
            )}"
          >

        </div>


        <div class="field">

          <label>

            ${
              client
                ? "Nova senha (opcional)"
                : "Senha"
            }

          </label>

          <input
            id="cs"
            type="password"
            ${
              client
                ? ""
                : "required"
            }
          >

        </div>


        <button
          type="submit"
          style="width:100%"
        >

          ${
            client
              ? "SALVAR"
              : "CRIAR CLIENTE"
          }

        </button>

      </form>
    `
  );


  $("cf").onsubmit =
  async e => {

    e.preventDefault();


    try{

      await api(

        client
          ? "/api/clients/" +
            client.id
          : "/api/clients",

        {

          method:
            client
              ? "PUT"
              : "POST",

          body:
            JSON.stringify({

              phone:
                $("cp").value,

              password:
                $("cs").value

            })

        }

      );


      closeM();

      clients();


    }catch(error){

      alert(
        error.message
      );

    }

  };

}


/* =========================
   EXCLUIR CLIENTE
========================= */

async function delC(id){

  if(
    !confirm(
      "Excluir cliente?"
    )
  ){
    return;
  }


  try{

    await api(

      "/api/clients/" +
      id,

      {
        method:"DELETE"
      }

    );


    clients();


  }catch(error){

    alert(
      error.message
    );

  }

}


/* =========================
   INICIAR
========================= */

boot();

</script>

</body>
</html>
